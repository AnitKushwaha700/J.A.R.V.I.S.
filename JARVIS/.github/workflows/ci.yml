name: Monorepo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend — Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: jarvis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://jarvis:test_password@localhost:5432/jarvis_test
      JWT_SECRET: test_jwt_secret_at_least_32_chars_long
      REFRESH_TOKEN_SECRET: test_refresh_secret_at_least_32_chars

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit & integration tests
        run: npm test -- --passWithNoTests

      - name: Build backend
        run: npm run build

  web-ci:
    name: Web & Desktop — Typecheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install monorepo dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck Web App
        run: npm run typecheck

      - name: Build Next.js Static Pages
        run: npm run build

  mobile-ci:
    name: Mobile — Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install monorepo dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck Mobile App
        run: npm run typecheck
